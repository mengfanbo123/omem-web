              - paragraph [ref=e280]: 【消费券发放机制-FR007+mall4j配置规范】 1. 消费券账本模型：coupon_batch(批次) → coupon(主表) → coupon_detail(明细) → coupon_transaction(流水) 2. 物理分表：消费者和商家完全分离，coupon_consumer/coupon_merchant、coupon_detail_consumer/coupon_detail_merchant、coupon_batch_consumer/coupon_batch_merchant 3. 积分与消费券关系：积分balance仅显示用，消费券有独立总表(balance)和明细表，抵扣时按"即将过期优先"原则使用明细，完全抵扣标记USED，部分抵扣标记PARTIAL_USED 4. 编号生成：couponNo/detailNo/transactionNo统一使用雪花ID 5. 批次合并：同business_type+同release_date合并到同一批次 6. 有效期：valid_until = valid_from + validity_days(默认30天) 7. mall4j配置表：tz_sys_config(不是sys_config！)，仅4字段(id/param_key/param_value/remark)，无param_type字段 8. 配置命名规范：全大写+下划线分隔(如SCORE_CONFIG)，复杂配置用JSON存储在param_value(mediumtext) 9. 配置热更新：Spring Cache机制，调用updateValueByKey自动清除缓存 10. 积分模块配置建议：复用tz_sys_config表，key建议POINT_CONFIG/POINT_EXPIRE_CONFIG等

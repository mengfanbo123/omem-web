              - paragraph [ref=e256]: "【消费券核销机制-FR008】 1. 核销触发：订单支付时同步调用内部API，订单金额≥order_min(10元)才触发 2. 核销算法：maxDeductible=orderAmount×deduct_ratio(0.8)，按valid_until ASC排序(先过期先用)，逐张核销直至可抵扣额度耗尽 3. 不找零规则：券余额>剩余可抵扣时，仅核销剩余可抵扣金额，差额不退还 4. 状态流转：UNUSED→USED(余额清零)，余额未清零保持UNUSED 5. 并发控制：Redis锁(coupon:lock:consume:{userId}:{orderId})+ 乐观锁(status=UNUSED条件更新) 6. 幂等保护：event_deduplicate + orderId维度去重(coupon_consume表) 7. 事务边界：单一本地事务，包含券明细更新、主表余额扣减、核销记录写入、流水记录 8. 乐观锁重试：更新券明细时重试3次，全部冲突则跳过该券继续下一张 9. 核销记录表：coupon_consume(consume_no/coupon_id/order_id/consume_amount/status) 10. 配置参数：deduct_ratio(0.8)、order_min(10)存储在param_release表"

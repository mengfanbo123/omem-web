              - paragraph [ref=e160]: 【用户双重身份机制-FR010补充-关键约束❗】 1. 用户概念：商家、消费者统称为用户，所有用户都拥有消费者身份 2. 商家双重身份：商家既有商家身份(shop_id)，也有消费者身份(user_id) 3. 商家登录农服平台客户端：以消费者身份登录，查询积分=商家身份积分+消费者身份积分(UNION ALL) 4. 商家积分释放：消费者在该商家消费后，定时释放的积分要释放到商家的积分表和消费券表(商家身份) 5. 商家作为消费者消费：该商家用消费者身份在平台消费，返利机制和正常消费者一样 6. 支付接口需求：提供按组合身份查询各积分的接口，判断当前用户是否拥有商家身份 7. 支付时消费券返回：如果用户拥有商家身份，则返回"商家身份可用消费券+消费者身份可用消费券"分别返回给前端 8. 表设计影响：需要通过user_id关联查询该用户是否有对应的shop_id(商家身份)

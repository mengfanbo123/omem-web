              - paragraph [ref=e208]: "【全局参数配置管理-FR009】 1. 参数存储：复用mall4j的tz_sys_config表(不是sys_config！)，字段：id/param_key/param_value/param_type/remark 2. 参数键前缀规范：point.kvalue.*、point.release.*、point.validity.* 3. Lambda参数独立表：param_lambda(factor_count/beta_decay)、param_lambda_factor(因子权重/算法类型) 4. 变更审计：parameter_change_log表记录所有参数变更(param_key/old_value/new_value/operator/remark) 5. 实时生效：参数修改后清除缓存，下次业务调用重新加载 6. 并发控制：Redis分布式锁(param:lock:update:{paramModule})，10秒过期 7. 事务边界：参数更新+日志写入同一事务，afterCommit清除缓存 8. 关键参数：deduct_ratio(0.8抵扣比例)、order_min(10元最低订单)、validity_days(30天消费券有效期) 9. 分配比例联动：consumer_ratio + merchant_ratio = 1.0必须校验 10. k值变更额外记录：修改k值参数时同时写入k_value_adjust_log表"

              - paragraph [ref=e328]: 【积分模块核心机制-FR001~004】 1. 积分发放(FR-001)：分佣完成后，资金池净流水L=进资金池J-补贴商家K，若L>0则消费者和商家各冻结L积分(1:1发放) 2. 积分释放机制： - 消费者：FR-003A即时释放(5秒延迟) + FR-004A每日集中释放 - 商家：FR-004B每日集中释放(无即时释放) 3. k值杠杆机制：发放1积分冻结，释放时可释放k积分可用(frozen_i -= M/k, balance_i += M) 4. k值分类：消费者k值和商家k值独立，FR-002调整时需分别计算 5. 分佣表依赖：distribution_record表暂按文档设计，联调时再调整 6. 公式链：C=A-B, E=A×r, J=E×0.5, L=J-C, M=N=IF(L>0,L,0)

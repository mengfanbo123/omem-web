              - paragraph [ref=e184]: "【消费券过期与退款-FR015~016】 1. FR-015过期处理：xxl-job定时任务(每日2:00)，扫描status=UNUSED且valid_until<NOW()的券，更新为EXPIRED 2. 过期积分回收：从source字段追溯原积分账户(格式POINT::{accountId})扣减，余额不足扣至0，记录差额日志 3. 过期流水：point_transaction(type=EXPIRE,amount负数)、platform_point_record(平台收益)、coupon_expire_log(过期日志) 4. 并发控制：Redis分布式锁(coupon:expire:lock:{日期})，30分钟过期，CAS更新券状态 5. FR-016纯券退款：订单pay_type=COUPON_ONLY，退款积分=coupon.balance原路返回用户积分账户 6. 全额退款回滚：fund_pool.balance -= D×0.5，消费者/商家frozen各-= D×0.5(D=订单金额×让利比例r) 7. 冻结积分不足处理：扣减至0不阻塞退款，记录扣减日志 8. 退款记录表：refund_record(refund_no/order_id/user_id/refund_type/coupon_refund/cash_refund/status) 9. 退款状态流转：PENDING→PROCESSING→COMPLETED/FAILED 10. 幂等保护：Redis锁(point:lock:refund:order:{orderId}) + refund_record表去重"

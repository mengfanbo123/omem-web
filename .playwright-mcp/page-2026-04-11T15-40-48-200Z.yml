              - paragraph [ref=e304]: "【绿色积分核心机制-FR005~006】 1. 绿色积分特性：1:1锚定(1元=1积分)、永久有效、不膨胀、必须上链蚂蚁链 2. 算法配置：支持固定比例/阶梯/自定义三种算法，按商品/店铺维度差异化配置 3. 链上幂等：合约processedTx[bizId]防重放，本地event_deduplicate防MQ重复投递，双重保险 4. userId映射：消费者NF_C_{userId}，商家NF_M_{shopId}，按类型区分前缀避免冲突 5. 事务一致性：本地积分增加与链上发放必须在同一事务，本地失败则链上不传，需重试+人工干预 6. 配置存储：复用mall4j的sys_config表，需探查其表结构和命名规范 7. 蚂蚁链SDK：mychainx-sdk-java-all 0.10.2.24.5，Solidity 0.4.24合约 8. 链上合约：GreenPointContract，支持issuePoints/consumePoints/compensatePoints/queryBalance"

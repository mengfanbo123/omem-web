              - paragraph [ref=e456]: "【Playwright 使用铁律 - 全局强制规则】 ## 触发条件（自动加载并立即执行） 只要师尊提及以下任一关键词，**立即直接调用 playwright MCP 工具**，不要任何 bash 命令： - playwright - 自动化测试 - 测试 - 网页 - 浏览器 - browser - 打开网页 - 访问网站 - 搜索（网页搜索） ## 强制规则（违者重罚！） 1. **禁止使用 skill_mcp 调用 playwright** 2. **禁止使用 bash 命令（npx playwright、pip3 等）** 3. **必须直接调用 playwright_ 前缀的 MCP 工具** 4. **看到关键词立即行动，不要检查安装、不要验证环境** 5. 原因：skill_mcp 会重启不带 --cdp-endpoint 的 MCP 实例，导致无法连接 Chrome ## Playwright 完整工具列表（21个）- 直接调用 ### 导航类 - `playwright_browser_navigate` - 打开网页（最常用） - `playwright_browser_navigate_back` - 后退 - `playwright_browser_tabs` - 标签页管理 ### 交互类 - `playwright_browser_click` - 点击元素 - `playwright_browser_hover` - 悬停 - `playwright_browser_type` - 输入文本 - `playwright_browser_press_key` - 按键 - `playwright_browser_fill_form` - 填充表单 - `playwright_browser_select_option` - 选择下拉选项 - `playwright_browser_drag` - 拖拽 - `playwright_browser_file_upload` - 上传文件 ### 信息获取类 - `playwright_browser_snapshot` - 获取页面快照（DOM结构） - `playwright_browser_take_screenshot` - 截图 - `playwright_browser_console_messages` - 获取控制台消息 - `playwright_browser_network_requests` - 获取网络请求 ### 执行类 - `playwright_browser_evaluate` - 执行 JavaScript - `playwright_browser_run_code` - 运行代码 ### 等待类 - `playwright_browser_wait_for` - 等待元素/条件 ### 对话框类 - `playwright_browser_handle_dialog` - 处理弹窗 ### 窗口管理类 - `playwright_browser_resize` - 调整窗口大小 - `playwright_browser_close` - 关闭浏览器 ## 正确调用示例（直接调用，无bash） ```typescript // ✅ 正确 - 直接调用 MCP 工具 playwright_browser_navigate({url: \"https://www.baidu.com\"}) playwright_browser_type({selector: \"#kw\", text: \"codingplan\"}) playwright_browser_click({selector: \"#su\"}) playwright_browser_snapshot() // ❌ 错误 - 使用 bash 命令 bash(\"npx playwright open ...\") bash(\"pip3 list | grep playwright\") // ❌ 错误 - 使用 skill_mcp skill_mcp(mcp_name=\"playwright\", tool_name=\"browser_navigate\", ...) ``` ## 典型场景处理 ### 师尊说：\"用 playwright 搜索 codingplan\" **立即执行**： 1. `playwright_browser_navigate({url: \"https://www.google.com\"})` 2. `playwright_browser_type({selector: \"input[name='q']\", text: \"codingplan\"})` 3. `playwright_browser_press_key({key: \"Enter\"})` ### 师尊说：\"打开百度\" **立即执行**： `playwright_browser_navigate({url: \"https://www.baidu.com\"})` ### 师尊说：\"playwright 自动化测试\" **立即执行**： 根据上下文直接调用相应工具，不要问\"要做什么测试\" ## 当前配置 - CDP端点：http://localhost:9222 - Chrome 已以调试模式运行 - 工具已就绪，直接调用即可 --- **此为师尊钦定铁律，新会话必遵守！看到关键词 = 立即调用工具！** 👑"
